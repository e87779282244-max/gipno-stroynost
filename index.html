<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гипно-стройность</title>
<meta name="theme-color" content="#efeaf6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Гипно-стройность">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="media/icon-180.png">
<style>
[hidden]{display:none!important}
:root{
  --bg:#efeaf6; --app:#f6f2fa; --surface:#ffffff; --surface-2:#ece6f4;
  --fg:#231c33; --muted:#6c6382; --faint:#a39cb6; --line:#e0d8ec;
  --accent:#5b3f9c; --accent-ink:#46307d; --accent-weak:rgba(91,63,156,.12);
  --good:#2f8a6a; --good-weak:rgba(47,138,106,.13);
  --warn:#b4672a; --warn-weak:rgba(180,103,42,.13);
  --shadow:0 1px 2px rgba(40,25,70,.06),0 8px 22px rgba(40,25,70,.08);
  --r:18px;
  font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{min-height:100vh}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--app);padding:calc(env(safe-area-inset-top) + 10px) 14px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.top{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.top .ttl{font-weight:800;font-size:18px}
.top .sub{font-size:12px;color:var(--muted)}
.logo{width:36px;height:36px;flex:none}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 12px;border:1px solid var(--line)}
.card h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.hero{background:linear-gradient(150deg,#5b3f9c,#3a2a6b);color:#fff;border:none}
.hero .dn{font-size:13px;opacity:.8;letter-spacing:.08em;text-transform:uppercase}
.hero .big{font-size:34px;font-weight:800;margin:2px 0 6px}
.hero .q{font-size:16px;line-height:1.35;font-style:italic;opacity:.95}
.hero .bar{height:6px;background:rgba(255,255,255,.2);border-radius:6px;margin-top:14px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:#c9b6ff;border-radius:6px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.btn{appearance:none;border:none;border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:var(--surface-2);color:var(--accent-ink)}
.btn.good{background:var(--good)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.timer{font-variant-numeric:tabular-nums;font-size:30px;font-weight:800}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--accent-weak);color:var(--accent-ink);font-size:12px;font-weight:700}
.pill.good{background:var(--good-weak);color:var(--good)}
.pill.warn{background:var(--warn-weak);color:var(--warn)}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:none}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--faint);flex:none;display:grid;place-items:center;transition:.15s}
.check.on .box{background:var(--good);border-color:var(--good)}
.check.on .box::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .lbl{flex:1;font-size:15px;line-height:1.3}
.check .lbl small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ex{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ex img{width:76px;height:76px;object-fit:cover;border-radius:12px;background:#fff;flex:none;border:1px solid var(--line)}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.set{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--muted);background:var(--app);cursor:pointer;font-size:15px}
.set.on{background:var(--good);border-color:var(--good);color:#fff}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
input,textarea,select{font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--app);color:var(--fg);width:100%}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
.grid2>*,.field{min-width:0}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.water{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:34px;height:42px;border-radius:6px 6px 10px 10px;border:2px solid #9fc3e6;background:#fff;cursor:pointer;position:relative;overflow:hidden}
.glass.on::after{content:"";position:absolute;inset:30% 0 0 0;background:#7fb2e5}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt button{padding:12px 10px;border-radius:14px;border:2px solid var(--line);background:var(--app);font:inherit;font-weight:700;color:var(--fg);cursor:pointer;text-align:left;line-height:1.25}
.opt button small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:3px}
.opt button.on{border-color:var(--accent);background:var(--accent-weak)}
.note{background:var(--warn-weak);color:#6b3d14;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;margin-top:10px}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.dcell{aspect-ratio:1;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;cursor:pointer;position:relative;font-size:15px}
.dcell small{font-size:9px;font-weight:600;color:var(--muted)}
.dcell.today{outline:3px solid var(--accent);outline-offset:1px}
.dcell.fri{background:#f4eefe}
.dcell .ring{position:absolute;left:4px;right:4px;bottom:4px;height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.dcell .ring i{display:block;height:100%;background:var(--good)}
.dcell.future{opacity:.55}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabs .in{display:flex;max-width:520px;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--faint);background:none;border:none;padding:6px 0;cursor:pointer;font-family:inherit}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.lib-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.lib-item:first-of-type{border-top:none}
.lib-item .cat{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.lib-item .nm{font-weight:700;font-size:15px}
.chev{margin-left:auto;color:var(--faint);font-size:20px}
.art h2{font-size:22px;margin:4px 0 14px}
.art h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:16px 0 6px}
.art p{margin:0 0 8px;line-height:1.5;font-size:15px}
.art ul{margin:0 0 8px;padding-left:20px;line-height:1.5}
.back{background:none;border:none;color:var(--accent);font:inherit;font-weight:700;padding:4px 0 10px;cursor:pointer}
.stat{background:var(--app);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.sos-fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:12;border:none;border-radius:999px;padding:12px 16px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,#d0537a,#8c3fb0);box-shadow:0 6px 18px rgba(140,63,176,.35);cursor:pointer}
.ov{position:fixed;inset:0;z-index:40;background:linear-gradient(160deg,#2c1f52,#120c24);color:#fff;overflow:auto;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(30px + env(safe-area-inset-bottom))}
.ov .in{max-width:480px;margin:0 auto}
.ov h2{font-size:24px;margin:18px 0 8px}
.ov p{line-height:1.5;opacity:.9}
.ov .x{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:12px;padding:8px 12px;font:inherit;font-weight:700}
.ov .ch{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.ov .ch small{display:block;font-weight:500;opacity:.7;margin-top:3px}
.ov .btn{background:#c9b6ff;color:#231c33}
.breath{width:200px;height:200px;margin:30px auto;border-radius:50%;background:radial-gradient(circle,#c9b6ff 0,#7a5bd0 60%,rgba(122,91,208,.2) 100%);display:grid;place-items:center;font-weight:800;font-size:18px;transform:scale(.6);transition:transform 4s ease-in-out}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.scale button{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--app);font:inherit;font-weight:800;font-size:13px;color:var(--muted);padding:0;cursor:pointer}
.scale button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mind{background:linear-gradient(150deg,#f4eefe,#fff)}
.mind .txt{font-size:16px;line-height:1.5;font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#231c33;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.ob{padding-top:20px}
.ob h1{font-size:28px;line-height:1.15;margin:14px 0 6px}
.cmp td,.cmp th{padding:8px 4px;border-top:1px solid var(--line);font-size:14px;text-align:left}
.cmp{width:100%;border-collapse:collapse}
.cmp input{padding:7px 8px;font-size:15px}
</style>
</head>

": "pushup", "n": "Отжимания", "s": 5, "r": 10, "u": ""}]}, {"d": 14, "w": 2, "q": "Сравнивайте себя не с другими, а с собой неделю назад.", "t": "16:00-17:00", "dish": "Тушёная говядина 200–500 г + квашеная капуста/огурцы — свободная порция по аппетиту.", "steps": "11 000-12 000", "stepsMin": 11000, "plank": 85, "ex": [{"k": "squat", "n": "Приседания", "s": 5, "r": 11, "u": ""}, {"k": "pushup", "n": "Отжимания", "s": 5, "r": 11, "u": ""}]}, {"d": 15, "w": 3, "q": "Половина пути - время не расслабляться, а закреплять.", "t": "17:00", "dish": "Курица 200–500 г со специями + тушёная капуста/овощи — свободная порция по аппетиту.", "steps": "13 000-14 000", "stepsMin": 13000, "plank": 90, "ex": [{"k": "lunge", "n": "Выпады", "s": 3, "r": 5, "u": "/нога"}, {"k": "crunch", "n": "Скручивания", "s": 3, "r": 8, "u": ""}]}, {"d": 16, "w": 3, "q": "Устойчивость важнее одного героического дня.", "t": "17:00-18:00", "dish": "Рыба по бюджету 200–500 г + салат огород/овощи — свободная порция по аппетиту.", "steps": "13 000-14 000", "stepsMin": 13000, "plank": 95, "ex": [{"k": "lunge", "n": "Выпады", "s": 3, "r": 6, "u": "/нога"}, {"k": "crunch", "n": "Скручивания", "s": 3, "r": 9, "u": ""}]}, {"d": 17, "w": 3, "q": "Плохая новость не требует плохой еды.", "t": "17:00-18:00", "dish": "Мясные котлеты без хлебной панировки: мясная часть 200–500 г + капустный салат по аппетиту.", "steps": "13 000-14 000", "stepsMin": 13000, "plank": 100, "ex": [{"k": "lunge", "n": "Выпады", "s": 3, "r": 7, "u": "/нога"}, {"k": "crunch", "n": "Скручивания", "s": 3, "r": 10, "u": ""}]}, {"d": 18, "w": 3, "q": "Хорошая новость тоже не требует переедания.", "t": "17:00-18:00", "dish": "Омлет/яйца + творог/сыр или мясо + овощи. Если выбираете мясо — ориентир 200–500 г.", "steps": "13 000-14 000", "stepsMin": 13000, "plank": 105, "ex": [{"k": "lunge", "n": "Выпады", "s": 3, "r": 8, "u": "/нога"}, {"k": "crunch", "n": "Скручивания", "s": 3, "r": 11, "u": ""}]}, {"d": 19, "w": 3, "q": "Держите обещание, которое дали самому себе.", "t": "", "dish": "Бульон с мясом 12/15/18 ч ИЛИ длительная пищевая пауза.", "steps": "13 000-14 000", "stepsMin": 13000, "plank": 110, "ex": [{"k": "lunge", "n": "Выпады", "s": 3, "r": 9, "u": "/нога"}, {"k": "crunch", "n": "Скручивания", "s": 3, "r": 12, "u": ""}], "fri": "broth"}, {"d": 20, "w": 3, "q": "Движение - это часть дня, а не наказание за еду.", "t": "12:00", "dish": "Тушёная говядина 200–500 г + овощи — свободная порция по аппетиту; после пятницы спокойно.", "steps": "13 000-14 000", "stepsMin": 13000, "plank": 115, "ex": [{"k": "lunge", "n": "Выпады", "s": 3, "r": 10, "u": "/нога"}, {"k": "crunch", "n": "Скручивания", "s": 3, "r": 13, "u": ""}]}, {"d": 21, "w": 3, "q": "Не ищите идеального меню. Ищите повторяемые решения.", "t": "17:00", "dish": "Курица/индейка 200–500 г + салат из капусты, огурца и зелени — свободная порция.", "steps": "13 000-14 000", "stepsMin": 13000, "plank": 120, "ex": [{"k": "lunge", "n": "Выпады", "s": 3, "r": 11, "u": "/нога"}, {"k": "crunch", "n": "Скручивания", "s": 3, "r": 14, "u": ""}]}, {"d": 22, "w": 4, "q": "Ваше окружение может не измениться. Ваши действия могут.", "t": "17:00-18:00", "dish": "Белая рыба 200–500 г + тушёные кабачки/баклажаны — свободная порция по аппетиту.", "steps": "15 000", "stepsMin": 15000, "plank": 125, "ex": [{"k": "bottle", "n": "Приседание + жим гантелей", "s": 5, "r": 10, "u": ""}]}, {"d": 23, "w": 4, "q": "Сегодня инвестируйте хотя бы немного в будущего себя.", "t": "17:00-18:00", "dish": "Омлет с мясом/сыром + помидоры и зелень. Если мясо — ориентир 200–500 г по аппетиту.", "steps": "15 000", "stepsMin": 15000, "plank": 130, "ex": [{"k": "bottle", "n": "Приседание + жим гантелей", "s": 5, "r": 11, "u": ""}]}, {"d": 24, "w": 4, "q": "Сильная система переживает слабую мотивацию.", "t": "17:00-18:00", "dish": "Индейка 200–500 г с грибами + салат огород/овощи — свободная порция по аппетиту.", "steps": "15 000", "stepsMin": 15000, "plank": 135, "ex": [{"k": "bottle", "n": "Приседание + жим гантелей", "s": 5, "r": 12, "u": ""}]}, {"d": 25, "w": 4, "q": "Простая еда и понятный режим освобождают внимание.", "t": "17:00-18:00", "dish": "Куриные бёдра 200–500 г + квашеная капуста/овощи — свободная порция по аппетиту.", "steps": "15 000", "stepsMin": 15000, "plank": 140, "ex": [{"k": "bottle", "n": "Приседание + жим гантелей", "s": 5, "r": 12, "u": ""}]}, {"d": 26, "w": 4, "q": "Не превращайте один промах в неделю промахов.", "t": "", "dish": "БЕЛКОВЫЙ ДЕНЬ: мясо, птица, рыба и яйца до комфортной сытости ИЛИ длительная пищевая пауза.", "steps": "15 000", "stepsMin": 15000, "plank": 145, "ex": [{"k": "bottle", "n": "Приседание + жим гантелей", "s": 5, "r": 13, "u": ""}], "fri": "protein"}, {"d": 27, "w": 4, "q": "Тело меняется медленнее решения. Продолжайте.", "t": "12:00", "dish": "После пятницы: рыба/птица 200–500 г + свежие овощи — по аппетиту, без компенсации.", "steps": "15 000", "stepsMin": 15000, "plank": 150, "ex": [{"k": "bottle", "n": "Приседание + жим гантелей", "s": 5, "r": 13, "u": ""}]}, {"d": 28, "w": 4, "q": "Последняя неделя - репетиция следующих месяцев.", "t": "17:00-18:00", "dish": "Тушёное мясо 200–500 г + салат огород/овощи — свободная порция по аппетиту.", "steps": "15 000", "stepsMin": 15000, "plank": 155, "ex": [{"k": "bottle", "n": "Приседание + жим гантелей", "s": 5, "r": 14, "u": ""}]}, {"d": 29, "w": 4, "q": "Посмотрите, сколько действий уже стали привычными.", "t": "17:00-18:00", "dish": "Ресторан: мясо/рыба/птица 200–500 г + салат/овощи по аппетиту; без крахмалистого гарнира.", "steps": "15 000", "stepsMin": 15000, "plank": 160, "ex": [{"k": "bottle", "n": "Приседание + жим гантелей", "s": 5, "r": 14, "u": ""}]}, {"d": 30, "w": 4, "q": "30 дней заканчиваются. Дисциплина остаётся.", "t": "17:00-18:00", "dish": "Свободный день: доступное мясо/рыба/птица 200–500 г + любимые низкоуглеводные овощи.", "steps": "15 000", "stepsMin": 15000, "plank": 165, "ex": [{"k": "bottle", "n": "Приседание + жим гантелей", "s": 5, "r": 15, "u": ""}]}];
const SECS=[{"p": 3, "cat": "ВВЕДЕНИЕ", "title": "Что на самом деле показывает вес", "blocks": [{"h": "ИЗ ЧЕГО СКЛАДЫВАЕТСЯ ВЕС", "t": "Вес тела состоит не только из жира. На весах одновременно отражаются жировая ткань, вода, гликоген, содержимое кишечника, мышечная масса и другие ткани. Поэтому после изменения питания первые изменения иногда происходят быстро: уменьшается задержка воды, расходуется часть гликогена, меняется объём содержимого ЖКТ. Это не означает, что за несколько дней исчезло столько же килограммов жира."}, {"h": "ЧТО УМЕНЬШАЕТ ЖИРОВУЮ МАССУ", "t": "Жировая ткань — запас энергии. Для устойчивого уменьшения жировой массы нужен энергетический дефицит во времени. Наша задача — создать такой образ питания и активности, при котором дефицит становится следствием привычек, а не ежедневной бухгалтерией каждой калории."}, {"h": "УМЕРЕННЫЙ ГОЛОД — НОРМАЛЬНОЕ ОЩУЩЕНИЕ", "t": "Мы не будем учиться бояться еды. Мы будем учиться не бояться умеренного голода. Небольшой голод между приёмами пищи — нормальное человеческое ощущение. Эволюционно человек не находился в состоянии постоянной сытости круглые сутки. Цель программы — научиться отличать реальную потребность в еде от привычки постоянно что-то жевать. Сильная слабость, головокружение или плохое самочувствие не являются целью."}]}, {"p": 4, "cat": "ИГ / ПРОТОКОЛ", "title": "ИГ-протокол: интервальное голодание", "blocks": [{"h": "ЧТО ТАКОЕ ИНТЕРВАЛЬНОЕ ГОЛОДАНИЕ", "t": "ИГ — интервальное голодание. Это организация суток, при которой периоды еды чередуются с периодами без обычной пищи. В нашей программе мы не начинаем с экстремального голодания. Мы постепенно отодвигаем первый приём пищи и наблюдаем, как меняются аппетит, привычки и контроль над едой."}, {"h": "ЗАЧЕМ МЫ ИСПОЛЬЗУЕМ ИГ", "t": "После еды, особенно содержащей углеводы, повышаются глюкоза и инсулин. Между приёмами пищи уровень инсулина обычно снижается, и организм больше опирается на собственные энергетические запасы. Общий энергетический баланс по-прежнему определяет изменение жировой массы, поэтому ИГ для нас — инструмент структуры и дисциплины, а не магия."}, {"h": "КАК НАЧИНАЕМ", "t": "Старт: первая неделя — ориентир первого полноценного приёма пищи около 12:00. Затем при хорошей переносимости постепенно двигаемся к 13:00, 14:00, 15:00 и примерно 16:00. Если позднее окно провоцирует вечернее переедание, возвращаемся к более раннему устойчивому варианту."}, {"h": "ЧТО МОЖНО ВО ВРЕМЯ ПИЩЕВОЙ ПАУЗЫ", "t": "Во время пищевой паузы: вода, минералка, несладкий зелёный/травяной чай, чёрный кофе без сахара. Небольшое количество MCT или кокосового масла некоторые используют для облегчения субъективного голода; это калорийный продукт и не является строгим бескалорийным постом."}]}, {"p": 5, "cat": "ПИТАНИЕ", "title": "Еда без кухонных весов", "blocks": [{"h": "БЕЛКОВАЯ ОСНОВА", "t": "В кафе, ресторане, столовой, дома и даже на корпоративе используйте один принцип: сначала ищите простой белковый продукт. Мясо, рыба, птица, яйца, подходящие кисломолочные продукты. Затем добавляйте овощи, зелень, салат."}, {"h": "СЫТОСТЬ, А НЕ МАЛЕНЬКАЯ ПОРЦИЯ", "t": "Не нужно бояться нормальной порции и пытаться остаться голодным после еды. Ешьте до комфортной сытости, но выбирайте продукты, которые помогают этой сытости наступить без постоянного добавления сладостей, хлеба, гарниров и жидких калорий."}, {"h": "КАК СМОТРЕТЬ НА УГЛЕВОДЫ", "t": "Гликемический индекс и гликемическая нагрузка помогают ориентироваться в углеводах. В этой программе мы чаще выбираем продукты с меньшей гликемической нагрузкой и не строим рацион вокруг концентрированных углеводных гарниров. При этом индивидуальный аппетит зависит не только от ГИ, но и от порции, белка, клетчатки, сна и общей энергии."}, {"h": "ПРОСТЫЕ СОЧЕТАНИЯ И ЭНЕРГОЁМКИЕ ПРОДУКТЫ", "t": "Простой выбор: кусок мяса + салат; рыба + тушёная капуста; птица + овощи; яйца + овощи. Если выбор ограничен — даже сыр и помидор могут быть практичнее сладкой выпечки или сладкого напитка. Орехи, сыр и масла удобны, но очень энергетически плотны. Используйте их как дополнение, а не как бесконтрольный перекус."}]}, {"p": 6, "cat": "ДВИЖЕНИЕ", "title": "Движение: минимум, который становится привычкой", "blocks": [{"h": "ШАГИ — БАЗОВЫЙ ОРИЕНТИР", "t": "10 000 шагов — наш практический ориентир. Для многих взрослых это означает несколько дополнительных прогулок в течение дня и заметное увеличение повседневного расхода энергии. Фактический расход сильно зависит от массы тела, скорости, рельефа и длины шага."}, {"h": "ЗАЧЕМ НУЖНА ХОДЬБА", "t": "Ходьба поддерживает аэробную форму, работу мышечной помпы нижних конечностей, контроль глюкозы после еды и общий объём ежедневной активности. Если сейчас вы делаете 3-4 тысячи шагов, не нужно за один день превращать их в 15 тысяч — повышайте объём постепенно."}, {"h": "ПЛАНКА КАЖДЫЙ ДЕНЬ", "t": "Планка каждый день: начинаем примерно с 15-30 секунд в хорошей технике и при нормальной переносимости добавляем около 5 секунд. Цель — не рекорд, а ежедневное напоминание телу о работе."}, {"h": "ПРИНЦИП ПРОГРЕССИИ", "t": "Каждый день старайтесь сделать хотя бы немного больше или немного лучше, чем вчера. Маленькое улучшение, повторённое десятки раз, становится системой."}]}, {"p": 8, "cat": "ДОБАВКИ", "title": "Добавки: только дополнение к системе", "blocks": [{"h": "ДОБАВКИ — НЕ ОСНОВА ПРОГРАММЫ", "t": "Добавки не заменяют питание, сон, движение и общий энергетический баланс. Учитывайте рацион, анализы, заболевания, лекарства и состав конкретного продукта."}, {"h": "ВИТАМИН D", "t": "Витамин D необходим не только для обмена кальция и здоровья костей: он участвует в работе мышц, иммунной системы и множестве регуляторных процессов организма. В рамках программы: витамин D — 4000 МЕ в сутки, ежедневно с едой."}, {"h": "МАГНИЙ", "t": "Магний участвует в работе мышц и нервной системы, поддерживает нормальный энергетический обмен и восстановление. В рамках программы: 350 мг элементарного магния вечером, желательно в форме глицината; вариант комплекса с витамином B6 допустим. Количество элементарного магния проверяйте на этикетке."}, {"h": "ОМЕГА-3 И РЫБИЙ ЖИР", "t": "Обычный рыбий жир служит источником омега-3 EPA/DHA. Жир печени трески дополнительно содержит витамины A и D, поэтому учитывайте их количество в общей схеме. В ежедневном плане программы используем простую отметку: рыбий жир — 5 г продукта с едой, 1 раз в день. Содержание EPA/DHA проверяйте на упаковке."}, {"h": "ЦИНК", "t": "Цинк необходим для нормальной работы иммунной системы и множества ферментативных процессов. В рамках программы: 25 мг в сутки с едой. Больше — не значит лучше: длительный избыток цинка может нарушать обмен меди."}, {"h": "КРЕАТИН", "t": "Креатин моногидрат — одна из наиболее изученных спортивных добавок. Он поддерживает работоспособность при интенсивной физической нагрузке и помогает прогрессировать в силовых тренировках. В рамках программы: 5 г креатина моногидрата в сутки."}]}, {"p": 9, "cat": "СИСТЕМА", "title": "Главный инструмент программы — система", "blocks": [{"h": "СИСТЕМА, А НЕ СПИСОК ЗАПРЕТОВ", "t": "Это не список запретов и не меню из дорогих «фитнес-продуктов». Это пошаговая инструкция, как встроить в обычную взрослую жизнь несколько простых инструментов, которые работают вместе."}, {"h": "ПИТАНИЕ И ПИЩЕВОЕ ОКНО", "t": "• Интервальное голодание — постепенно увеличиваем время без пищи после пробуждения. • 1-2 полноценных приёма пищи: первый открывает пищевое окно, второй нужен только если через несколько часов вернулся нормальный голод. • Белковая основа — мясо, птица, рыба, яйца и доступные замены. Для мяса/рыбы/птицы рабочий ориентир основного приёма — обычно 200-500 г по аппетиту. • Обычные овощи и ферментированные продукты. • Вода и минералы в течение дня."}, {"h": "ДВИЖЕНИЕ И ТРЕНИРОВКИ", "t": "• Шаги — от 10 000 с постепенным ростом объёма. • Планка каждый день — прогрессируем примерно по 5 секунд при хорошей технике. • С первого дня — лёгкое кардио по желанию; со второй недели — домашняя силовая работа; дальше бассейн, зал или любимый спорт."}, {"h": "ДИСЦИПЛИНА НА 30 ДНЕЙ", "t": "• Дисциплина — если один день не получился, на следующий день программа продолжается, а не начинается заново. Ваша задача на 30 дней — не быть идеальным. Ваша задача — сделать эти действия настолько понятными, чтобы они переживали работу, семью, поездки, праздники и стресс."}]}, {"p": 10, "cat": "ИГ / ПРОТОКОЛ", "title": "ИГ: считаем часы после пробуждения", "blocks": [{"h": "КАК СЧИТАТЬ ОКНО БЕЗ ЕДЫ", "t": "Вместо одной цифры для всех мы смотрим на два ориентира: время первого приёма пищи и сколько часов после пробуждения вы провели без обычной еды. Для примера ниже человек просыпается примерно в 6:00-7:00."}, {"h": "НЕДЕЛЯ 1", "t": "• Неделя 1: первый приём постепенно 12:00 → 13:00 → 14:00 → 15:00. Это примерно 5-9 часов без еды после пробуждения."}, {"h": "НЕДЕЛЯ 2", "t": "• Неделя 2: после пятничного сброса режима снова наращиваем окно и постепенно движемся к 16:00-18:00. Это примерно 9-12 часов после пробуждения."}, {"h": "НЕДЕЛИ 3-4", "t": "• Неделя 3: стараемся устойчиво переносить примерно 9-11 часов после пробуждения без обычной пищи, если нет слабости и вечернего переедания. • Неделя 4: ориентир остаётся индивидуальным; для многих это первый приём около 16:00-18:00 при подъёме в 6:00-7:00."}, {"h": "ОРИЕНТИР ВАЖНЕЕ ЖЁСТКОЙ ЦИФРЫ", "t": "Это не означает, что каждый обязан голодать одинаковое количество часов. Сон, последняя еда накануне, тренировки, лекарства и самочувствие меняют переносимость режима. ИГ — инструмент структуры, а не соревнование. Проснулись — не спешите автоматически есть. Вода, чай или чёрный кофе без сахара, движение и обычные дела помогают спокойно пройти первую часть дня."}]}, {"p": 11, "cat": "РАЗГРУЗОЧНЫЕ ДНИ", "title": "Пятница: отдельный режим", "blocks": [{"h": "ДВА ВАРИАНТА ПЯТНИЦЫ", "t": "Пятница не обязана подчиняться обычному ИГ-окну. В этот день используем недельный вариант ниже или, для опытных участников, длительную пищевую паузу."}, {"h": "НЕДЕЛЯ 1 • КЕФИРНЫЙ ДЕНЬ", "t": "В первую пятницу — простой разгрузочный день на кефире или натуральном кисломолочном продукте без сахара. Ориентир: 3-4 приёма по голоду, например 12:00, 15:00, 18:00 и при необходимости 21:00."}, {"h": "НЕДЕЛЯ 2 • САЛАТНЫЙ ДЕНЬ", "t": "Во вторую пятницу основа дня — большие овощные салаты на ваш выбор. Ориентир: 3 приёма, например 12:00, 15:00 и 18:00. Используйте листовую зелень, огурцы, помидоры, капусту и другие овощи. Можно 1-2 раза сделать зелёный смузи: примерно 1/2 стакана ягод + горсть зелени + вода."}, {"h": "НЕДЕЛЯ 3 • БУЛЬОННЫЙ ДЕНЬ", "t": "В третью пятницу — бульонный день: насыщенный мясной, куриный или рыбный бульон с небольшим количеством мяса или птицы. Ориентир: несколько небольших приёмов, например 12:00, 15:00 и 18:00. Ешьте по голоду и ориентируйтесь на самочувствие."}, {"h": "НЕДЕЛЯ 4 • БЕЛКОВЫЙ ДЕНЬ", "t": "В четвёртую пятницу — белковый день: мясо, птица, рыба и яйца небольшими простыми приёмами пищи. Ешьте до комфортной сытости, без жёсткого расписания. Альтернатива — длительная пищевая пауза."}, {"h": "ДЛИТЕЛЬНАЯ ПИЩЕВАЯ ПАУЗА • ОПЦИОНАЛЬНО", "t": "Для тех, кто уже знаком с длительным голоданием и хорошо его переносит: последний приём пищи можно сделать в четверг около 16:00-18:00. Если первый приём пищи в субботу около 12:00, пауза составит примерно 42-44 часа. При желании и хорошей переносимости можно сделать полные 48 часов и поесть в субботу около 16:00-18:00. Это продвинутый вариант и он не обязателен для результата программы. Во время паузы — вода и напитки без калорий. При выраженном недомогании паузу прекращаем."}]}, {"p": 12, "cat": "СИСТЕМА", "title": "Суббота и воскресенье после пятницы", "blocks": [{"h": "ПОСЛЕ ДЛИТЕЛЬНОЙ ПАУЗЫ", "t": "Если пятница была длительной пищевой паузой, субботу открываем примерно в 12:00 обычным полноценным приёмом пищи: запечённая белая рыба, курица, яйца или другое привычное белковое блюдо + овощной гарнир. Не нужно компенсировать голод огромным количеством еды."}, {"h": "ПОСЛЕ РАЗГРУЗОЧНОЙ ПЯТНИЦЫ", "t": "Если пятница была разгрузочной, суббота также возвращает обычный рацион. В воскресенье снова двигаем первый приём пищи позже — например к 15:00-16:00 — и со следующего понедельника продолжаем прогрессию."}, {"h": "БАНЯ И САУНА", "t": "По желанию: суббота или воскресенье могут стать днём сауны/бани как ритуала отдыха и восстановления. Это не способ «вытопить жир»: быстрое изменение веса после сауны — в основном жидкость. После длительной пищевой паузы не сочетайте обезвоживание и экстремальную жару; сначала восстановите воду и оцените самочувствие."}, {"h": "ГЛАВНЫЙ ПРИНЦИП ВЫХОДНЫХ", "t": "После пятницы мы не «награждаем себя едой». Мы просто возвращаемся к обычной системе."}]}, {"p": 13, "cat": "ПИТАНИЕ", "title": "Основное меню и запасные варианты", "blocks": [{"h": "ОБЫЧНАЯ ПИЩА — ОСНОВА", "t": "Под «обычной пищей» в этой программе мы понимаем простую основу: мясо, птица, рыба или яйца + овощи на гарнир. Если основа — мясо/рыба/птица, рабочий ориентир основного приёма — примерно 200-500 г по аппетиту. Выбирайте то, что нравится по вкусу, доступно и удобно. После еды при желании — простой фрукт, например яблоко или груша."}, {"h": "ПРИМЕРЫ ОСНОВНЫХ БЛЮД", "t": "Запечённая белая рыба под сырной шапкой с луком + салат огород; тушёная говядина + тушёная капуста; куриные ножки/бёдра со специями + салат огород. Индейка + квашеная капуста и солёные огурцы; печень с луком + свежий капустный салат; скумбрия/сельдь + овощи; омлет/яйца + мясо или сыр + помидоры и зелень."}, {"h": "КАК ГОТОВИТЬ И МЕНЯТЬ ПРИМЕРЫ", "t": "Это именно примеры, а не жёсткое меню. Используйте любимые специи и доступные продукты. Базовый принцип: белковая основа + овощи. По возможности не добавляйте муку, панировку и сладкие соусы: они незаметно увеличивают количество рафинированных углеводов и общую энергетическую плотность блюда."}, {"h": "СЫТОСТЬ ВАЖНЕЕ «ДИЕТИЧЕСКОЙ» ЕДЫ", "t": "На 30 дней стараемся убрать привычные крахмалистые и сладкие добавки: картофель фри, макароны, белый рис, сладкие каши, печенье и обычные десерты. Цель не в том, что углеводы «плохие», а в том, чтобы упростить контроль порции. Белковая пища и овощи обычно хорошо насыщают. Ориентир — комфортная сытость, а не заранее заданная маленькая порция и не переедание."}, {"h": "ЗАПАСНОЙ ВАРИАНТ БЕЗ КУХНИ", "t": "Курица-гриль, рыбные консервы, варёные яйца, готовый ростбиф или запечённое мясо, пакет салата, помидоры/огурцы, квашеная капуста. Это страховка на занятый день, а не основа ежедневного меню."}]}, {"p": 14, "cat": "ПИТАНИЕ", "title": "1-2 приёма пищи: как пользоваться примерами", "blocks": [{"h": "КАК ИСПОЛЬЗОВАТЬ ПРИМЕРЫ", "t": "Каждый день указан пример первого полноценного приёма пищи. Именно он открывает ваше пищевое окно после периода без еды. Если после него вы сыты до конца дня — второго приёма не требуется. Если через несколько часов появился нормальный голод — сделайте второй полноценный приём."}, {"h": "1 ИЛИ 2 ПРИЁМА — ПО АППЕТИТУ", "t": "Это не расписание «обязательно два раза». Если в первом приёме было, например, 400-500 г мяса/рыбы/птицы и вы остались сыты — второго приёма может не быть вообще. Если первый приём был ближе к 200 г и через несколько часов голод вернулся — спокойно поешьте ещё раз."}, {"h": "РАЗМЕР БЕЛКОВОЙ ПОРЦИИ", "t": "Для мяса, рыбы или птицы рабочий ориентир в основном приёме — примерно 200-500 г. Не нужно специально останавливаться на 300 г: более крупному или активному человеку может быть комфортно 400-500 г. При этом цифра не является целью — не заставляйте себя доедать через насыщение. Выбирайте продукт, который нравится, доступен и удобен именно вам."}, {"h": "КАК ЗАКРЫТЬ ПИЩЕВОЕ ОКНО", "t": "После первого приёма пищи оставьте организму время. Второй приём — только по голоду и обычно через несколько часов. Последний плотный приём желательно закончить примерно за 1,5–2 часа до сна. Постоянные перекусы между приёмами не нужны."}, {"h": "ПРИНЦИП ВАЖНЕЕ РЕЦЕПТА", "t": "Доступный белок + простой низкоуглеводный овощной гарнир + вода. Ешьте до комфортной сытости, а количество приёмов и размер белковой порции регулируйте реальным аппетитом."}]}, {"p": 15, "cat": "ПИТАНИЕ", "title": "Вода в течение дня", "blocks": [{"h": "БАЗОВЫЙ ОРИЕНТИР", "t": "Практический ориентир — примерно 1,5-2 литра жидкости в сутки для многих взрослых, с поправкой на жару, массу тела, тренировки, рацион и медицинские ограничения. Удобно выпивать стакан воды каждые несколько часов. • Обычная питьевая вода — база."}, {"h": "МИНЕРАЛЬНАЯ ВОДА И ЭЛЕКТРОЛИТЫ", "t": "• Минеральная вода — смотрите этикетку: содержание натрия и магния сильно различается. • Более минерализованная натриевая вода в первой половине дня может быть удобна некоторым людям во время пищевой паузы, особенно при потоотделении. • Вода с натрием около 1000-1500 мг/л и выше уже высоконатриевая. Это не универсальная рекомендация при гипертонии, заболеваниях почек/сердца или назначенном ограничении соли."}, {"h": "КОФЕ, ЧАЙ И СЛАДКИЕ НАПИТКИ", "t": "• Чёрный кофе и несладкий чай допустимы; сладкие напитки убираем."}]}, {"p": 16, "cat": "ПИТАНИЕ", "title": "Простая еда может быть дешёвой", "blocks": [{"h": "ПОЛЕЗНАЯ ЕДА НЕ ОБЯЗАНА БЫТЬ ДОРОГОЙ", "t": "Полезность не измеряется ценой. В разных странах, семьях и бюджетах набор продуктов будет отличаться. Используйте местные продукты, сезонные овощи, замороженную рыбу, недорогие части мяса и блюда, которые умеете готовить."}, {"h": "ПРОСТЫЕ БЮДЖЕТНЫЕ РЕШЕНИЯ", "t": "• Недорогой кусок говядины можно тушить несколько часов и получить полноценное блюдо на несколько приёмов. • Куриная ножка со специями и ложкой сметаны может быть проще и дешевле модного «фитнес-боула». • Капуста — свежая, тушёная или квашеная — доступный гарнир. • Солёные/бочковые огурцы, помидоры, лук, редис, зелень — обычные продукты, а не специальная диетическая еда. • Рыба не обязана быть лососем: выбирайте то, что доступно в вашем регионе и бюджете."}, {"h": "ПРОГРАММА ДЛЯ РЕАЛЬНОЙ ЖИЗНИ", "t": "Программа должна работать не только в идеальном магазине и на идеальной кухне. Она должна работать в вашей реальной жизни."}]}, {"p": 20, "cat": "ТРЕНИРОВКИ", "title": "Лёгкое кардио и тренажёрный зал", "blocks": [{"h": "ЛЁГКОЕ КАРДИО МОЖНО С ПЕРВОГО ДНЯ", "t": "Лёгкое кардио можно добавить уже с первого дня. Ходьба на дорожке, велотренажёр или эллипс в устойчивом умеренном темпе. Ориентир — дыхание учащено, но вы ещё можете говорить фразами. Новичку достаточно начать с 20-30 минут и постепенно увеличивать время; подготовленный человек может использовать 45-60 минут. Сериал, подкаст, аудиокнига или несложная работа на планшете помогают не скучать, если это безопасно."}, {"h": "ЕСЛИ ВЫ УЖЕ ХОДИТЕ В ЗАЛ", "t": "Продолжайте. Используйте программу для контроля питания, активности и восстановления. Новичку полезно поставить технику с тренером. Силовые тренировки всего тела 2-4 раза в неделю можно подбирать по опыту и восстановлению. Сывороточный протеин — удобный дополнительный источник белка, но не обязательный продукт."}]}, {"p": 21, "cat": "ВОССТАНОВЛЕНИЕ", "title": "Сон — часть программы", "blocks": [{"h": "ЦЕЛЬ СНА", "t": "Старайтесь регулярно получать 7-8 часов сна. Выберите стабильное время отбоя и подъёма; за 30-60 минут до сна по возможности уберите телефон и рабочую переписку; спальню держите прохладной, тёмной и проветренной."}, {"h": "ЕДА И ВОССТАНОВЛЕНИЕ", "t": "Большой последний приём пищи удобно заканчивать примерно за 1,5-2 часа до сна, если это комфортно. Сон не является отдельным «жиросжигающим окном», но организм продолжает расходовать энергию ночью, а недостаток сна может ухудшать контроль аппетита, восстановление и состав потери массы при дефиците."}]}];

","Сегодня я вкладываю в будущего себя. Даже маленький вклад растёт.","Мотивация приходит и уходит. Система остаётся и ведёт меня вперёд.","Простая еда и ясный режим освобождают голову. У меня больше внимания для жизни.","Один промах — это просто один промах. Я возвращаюсь в систему со следующего шага.","Тело меняется медленнее решения. Я спокойно продолжаю — изменения уже идут.","Эта неделя — репетиция следующих месяцев. Я проживаю её так, как хочу жить дальше.","Сколько действий уже стали привычными. Мне больше не нужно себя заставлять.","Тридцать дней заканчиваются. Мой новый режим остаётся со мной."];

function ask(msg,{input=null,ok='Да',cancel='Отмена'}={}){return new Promise(res=>{
  const w=document.createElement('div');w.style.cssText='position:fixed;inset:0;background:rgba(20,10,40,.45);z-index:50;display:grid;place-items:center;padding:20px';
  w.innerHTML=`<div class="card" style="max-width:360px;width:100%;margin:0"><div style="font-size:16px;line-height:1.4;margin-bottom:12px">${esc(msg)}</div>${input!==null?`<input id="ask-in" value="${esc(input)}" style="margin-bottom:12px">`:''}<div class="row" style="justify-content:flex-end"><button class="btn ghost sm" data-a="0">${cancel}</button><button class="btn sm" data-a="1">${ok}</button></div></div>`;
  document.body.appendChild(w);
  w.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const v=b.dataset.a==='1'?(input!==null?w.querySelector('#ask-in').value:true):(input!==null?null:false);w.remove();res(v)});
})}

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function curDay(){if(!S.profile)return 1;const a=parseISO(S.profile.start),b=new Date();b.setHours(0,0,0,0);return Math.floor((b-a)/864e5)+1}
function dateOf(n){const a=parseISO(S.profile.start);a.setDate(a.getDate()+n-1);return a}
const WD=['вс','пн','вт','ср','чт','пт','сб'];
function fmtDate(d){return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
function D(n){return S.days[n]||(S.days[n]={})}
function PD(){S.prep=S.prep||{tasks:{},days:{}};const k=iso(new Date());return S.prep.days[k]||(S.prep.days[k]={})}
function X(n){if(n<0){S.mdays=S.mdays||{};return S.mdays[-n]||(S.mdays[-n]={})}return n>0?D(n):PD()}
function mondayFrom(s){const d=parseISO(s);const w=d.getDay();if(w!==1)d.setDate(d.getDate()+((8-w)%7||7));return iso(d)}
function prepInfo(){const p=S.profile;if(!p.prep||p.prep>=p.start)return null;const a=parseISO(p.prep),b=parseISO(p.start),t=new Date();t.setHours(0,0,0,0);
  const N=Math.round((b-a)/864e5),k=Math.floor((t-a)/864e5)+1;return {N,k,active:k>=1&&k<=N}}
function fmtDur(ms){if(ms<0)ms=0;const m=Math.floor(ms/6e4);return Math.floor(m/60)+' ч '+String(m%60).padStart(2,'0')+' мин'}
function num(v){const x=parseFloat(String(v??'').replace(',','.'));return isNaN(x)?null:x}
function waterNorm(n){const p=S.profile||{},x=n>0?(S.days[n]||{}):n<0?((S.mdays||{})[-n]||{}):{};
  let w=null;if(n<0)w=maintLastWeight(-n);for(let i=n<0?30:Math.max(1,n);!w&&i>=1;i--){const v=num((S.days[i]||{}).weight);if(v){w=v;break}}w=w||num(p.w0);const h=num(p.height),sex=p.sex;
  if(!w||!sex)return null;const k=sex==='f'?31:35;let ref=w,why='';
  if(h&&w/((h/100)**2)>=25&&h-100<w){ref=h-100;why=' (при лишнем весе — от идеального: рост − 100)'}
  const parts=[[k+' мл × '+f1(ref)+' кг'+why,ref*k]];
  const dd=n>0?DAYS[n-1]:null;const trained=n!==0&&(((x.train||'').length>0)||(x.chk||{}).z2||(x.chk||{}).str||(dd&&dd.ex.length&&dd.ex.every(e=>((x.sets||{})[e.k]||[]).filter(Boolean).length>=e.s)));
  if(trained)parts.push(['тренировка сегодня',500]);
  const ml=Math.round(parts.reduce((a,q)=>a+q[1],0)/50)*50;return {ml,parts}}
function glassMl(){return +(S.profile&&S.profile.glass)||250}
function waterMl(x){return x.wml!=null?x.wml:(x.water||0)*250}
function stepsLabel(dd){return dd.w===4?'≈'+dd.steps:dd.steps}

/* ---------- оценка выполнения дня ---------- */
function score(n){
  const dd=DAYS[n-1],x=S.days[n]||{};let tot=0,ok=0;
  const add=c=>{tot++;if(c)ok++};
  add(!!x.mealTime||!!x.friMode);
  add(num(x.steps)!==null&&num(x.steps)>=dd.stepsMin);
  add(num(x.plank)!==null&&num(x.plank)>=dd.plank);
  dd.ex.forEach(e=>add(((x.sets||{})[e.k]||[]).filter(Boolean).length>=e.s));
  {const nm=waterNorm(n);add(waterMl(x)>=(nm?nm.ml*0.9:1500))}
  add(!!(x.chk||{}).supp);
  add(!!(x.chk||{}).mg);
  add(num(x.weight)!==null);
  add(!!(x.chk||{}).morning);
  add(!!(x.chk||{}).evening);
  return tot?ok/tot:0;
}

  // Движение
  h+=`<div class="card"><h3>Движение • план</h3>

  S.profile.prep=today;S.profile.start=mondayFrom(today);if(lw)S.profile.w0=String(lw);MEAS.forEach(([k])=>{const v=k==='waist'?(lastWaist||F0.waist):F0[k];if(v)S.profile[k+'0']=v});
  save();VIEW={tab:'today'};render();scrollTo(0,0);toast('Новый круг! День 1 — '+fmtDate(parseISO(S.profile.start)));
}

/* ---------- ПРОГРЕСС ---------- */
function series(f){const a=[];for(let i=1;i<=30;i++){const v=num((S.days[i]||{})[f]);if(v!==null)a.push([i,v])}return a}
function lineChart(pts,opt={}){
  if(pts.length<1)return `<div class="tiny muted">Пока нет данных — заполняйте вечерний трекер.</div>`;
  const W=320,H=150,p=26;const ys=pts.map(q=>q[1]);let mn=Math.min(...ys),mx=Math.max(...ys);if(mx-mn<1){mn-=1;mx+=1}
  const MX=opt.max||30;if(opt.base!=null){mn=Math.min(mn,opt.base-.5);mx=Math.max(mx,opt.base+(opt.corr||0)+.5)}
  const X=d=>p+(d-1)*(W-p-8)/(MX-1),Y=v=>H-18-(v-mn)*(H-30)/(mx-mn);
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  [mn,(mn+mx)/2,mx].forEach(v=>{s+=`<line x1="${p}" x2="${W-6}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e0d8ec"/><text x="2" y="${Y(v)+4}" font-size="10" fill="#a39cb6">${Math.round(v*10)/10}</text>`});
  if(opt.base!=null){s+=`<line x1="${p}" x2="${W-6}" y1="${Y(opt.base)}" y2="${Y(opt.base)}" stroke="#2f8a6a" stroke-dasharray="4 3"/><line x1="${p}" x2="${W-6}" y1="${Y(opt.base+opt.corr)}" y2="${Y(opt.base+opt.corr)}" stroke="#b4672a" stroke-dasharray="4 3"/>`}
  (MX>30?[1,15,30,45,60,75,90]:[1,7,14,21,28]).forEach(d=>s+=`<text x="${X(d)}" y="${H-3}" font-size="10" fill="#a39cb6" text-anchor="middle">${d}</text>`);
  if(opt.bars){pts.forEach(([d,v])=>{const y=Y(v);s+=`<rect x="${X(d)-3.5}" y="${y}" width="7" height="${H-18-y}" rx="2" fill="#8f73d1"/>`});
    if(opt.goal)opt.goal.forEach(([a,b,v])=>{if(v>=mn&&v<=mx)s+=`<line x1="${X(a)-4}" x2="${X(b)+4}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2f8a6a" stroke-width="2" stroke-dasharray="4 3"/>`})}
  else{s+=`<polyline fill="none" stroke="#8f73d1" stroke-width="2" points="${pts.map(([d,v])=>X(d)+','+Y(v)).join(' ')}"/>`;pts.forEach(([d,v])=>s+=`<circle cx="${X(d)}" cy="${Y(v)}" r="3" fill="#5b3f9c"/>`);
    if(opt.avg)opt.avg.forEach(([a,b,v])=>s+=`<line x1="${X(a)}" x2="${X(b)}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2f8a6a" stroke-width="3" stroke-linecap="round"/>`)}
  return s+'</svg>';
}
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
function weekStats(w){
  const r=[(w-1)*7+1,Math.min(w*7,30)];const ids=[];for(let i=r[0];i<=r[1];i++)ids.push(i);
  const g=f=>ids.map(i=>num((S.days[i]||{})[f])).filter(v=>v!==null);
  return {r,weight:avg(g('weight')),steps:avg(g('steps')),sleep:avg(g('sleep')),
    window:ids.filter(i=>(S.days[i]||{}).mealTime||(S.days[i]||{}).friMode).length,
    train:ids.filter(i=>{const x=S.days[i]||{};return (x.train&&x.train.length)||DAYS[i-1].ex.length&&DAYS[i-1].ex.every(e=>((x.sets||{})[e.k]||[]).filter(Boolean).length>=e.s)}).length};
}
const f1=v=>v===null?'—':(Math.round(v*10)/10).toString().replace('.',',');

  if(VIEW.week==='final')return renderFinal();

    <div class="stat"><b>${f1(avg(series('steps').map(q=>q[1])))==='—'?'—':Math.round(avg(series('steps').map(q=>q[1]))).toLocaleString('ru-RU')}</b><span>шагов в среднем</span></div>

    <div class="grid3" style="grid-template-columns:repeat(4,1fr)">${hbw.map((v,i)=>`<div class="stat"><b>${f1(v)}</b><span>нед. ${i+1}</span></div>`).join('')}</div></div>`;
  if(S.mdays&&Object.keys(S.mdays).length){const mp=[];for(let i=1;i<=90;i++){const v=num((S.mdays[i]||{}).weight);if(v)mp.push([i,v])}const b=S.maint&&S.maint.base;
    h+=`<div class="card chart"><h3>Вес в поддержке <span class="r">зелёная — база, оранжевая — коридор</span></h3>${lineChart(mp,{max:90,base:b||undefined,corr:MCORR})}</div>`}
  h+=`<div class="card"><h3>Фото прогресса <span class="r">спереди и сбоку</span></h3>${photoGrid(['start','d15','d30'])}${photoCompareBtn()}</div>`;

  h+=`<div class="card"><h3>Контрольные точки</h3>${[1,2,3,4].map(w=>`<div class="lib-item" data-wk="${w}"><div><div class="cat">Дни ${(w-1)*7+1}–${w*7}</div><div class="nm">Итоги недели ${w}${(S.weeks[w]||{}).done?' <span class="pill good">✓</span>':''}</div></div><span class="chev">›</span></div>`).join('')}
    <div class="lib-item" data-wk="final"><div><div class="cat">Финиш</div><div class="nm">Старт → день 30</div></div><span class="chev">›</span></div></div>`;

const MEAS=[['waist','Талия'],['hips','Бёдра'],['chest','Грудь'],['arm','Рука']];
function measStart(k){return num(S.profile[k+'0'])}
function measCard(){
  const cols=[['Старт',k=>measStart(k)],...[1,2,3,4].map(w=>['Н'+w,k=>num((S.weeks[w]||{})[k])]),['Д30',k=>num(S.final[k])]];
  const any=MEAS.some(([k])=>cols.some(c=>c[1](k)!==null));
  if(!any)return `<div class="card"><h3>Обхваты, см</h3><div class="small muted">Внесите стартовые обхваты в профиле, затем — в итогах каждой недели.</div></div>`;
  return `<div class="card"><h3>Обхваты, см</h3><div style="overflow-x:auto"><table class="cmp"><tr><th></th>${cols.map(c=>`<th style="text-align:center">${c[0]}</th>`).join('')}<th style="text-align:center">±</th></tr>
  ${MEAS.map(([k,l])=>{const vals=cols.map(c=>c[1](k));const f=vals.find(v=>v!==null),la=[...vals].reverse().find(v=>v!==null);const dlt=f!==null&&la!==null&&vals.filter(v=>v!==null).length>1?la-f:null;

function bindProgress(){
  document.querySelectorAll('[data-wk]').forEach(el=>el.onclick=()=>{VIEW.week=el.dataset.wk==='final'?'final':+el.dataset.wk;render();scrollTo(0,0)});

  const wd=$('#wk-done');if(wd)wd.onclick=()=>{const r=S.weeks[VIEW.week];r.done=true;save();toast('Итоги недели '+VIEW.week+' сохранены');VIEW.week=null;render();scrollTo(0,0)};
  bindPhotos();
}

function icsFold(s){const out=[];let line='';for(const ch of s){if(new TextEncoder().encode(line+ch).length>73){out.push(line);line=' '+ch}else line+=ch}out.push(line);return out.join('\r\n')}

}

const PSLOT={start:'Старт',d15:'День 15',d30:'День 30'},PVIEW={front:'Спереди',side:'Сбоку'};
const PCACHE={};
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('gipno',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function idbOp(mode,fn){const db=await idb();return new Promise((ok,no)=>{const tx=db.transaction('photos',mode),st=tx.objectStore('photos');const rq=fn(st);tx.oncomplete=()=>ok(rq&&rq.result);tx.onerror=()=>no(tx.error)})}
const photoGet=id=>PCACHE[id]?Promise.resolve(PCACHE[id]):idbOp('readonly',s=>s.get(id)).then(v=>{if(v)PCACHE[id]=v;return v}).catch(()=>null);
const photoPut=(id,v)=>{PCACHE[id]=v;return idbOp('readwrite',s=>s.put(v,id)).catch(()=>{})};
const photoDel=id=>{delete PCACHE[id];return idbOp('readwrite',s=>s.delete(id)).catch(()=>{})};
function findPhoto(slot,view){return (S.photos||[]).find(p=>p.slot===slot&&p.view===view)}
function compress(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.75))};im.onerror=()=>no(new Error('img'));im.src=u})}

function deepMerge(a,b){ // b (телефон) поверх a (облако); массивы SOS — объединение
  if(Array.isArray(a)&&Array.isArray(b)){const m=new Map();a.concat(b).forEach(x=>m.set(x&&x.ts?x.ts:JSON.stringify(x),x));return [...m.values()]}
  if(a&&b&&typeof a==='object'&&typeof b==='object'&&!Array.isArray(a)&&!Array.isArray(b)){const r={...a};for(const k in b)r[k]=k in a?deepMerge(a[k],b[k]):b[k];return r}
  return b===undefined||b===null||b===''?a:b}
async function cloudPush(){if(!CL.user||!navigator.onLine)return;try{const now=Date.now();await cDoc().set({state:JSON.stringify(strip(S)),updated:now,v:1});S._sync=now;S._upd=Math.min(S._upd||now,now);save(true);CL.msg='Сохранено в облаке '+new Date(now).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});CL.err=false}catch(e){CL.msg='Не удалось сохранить в облако — повторим позже';CL.err=true}refreshCloudUI()}
function cloudPushSoon(){if(!CL.user)return;clearTimeout(CL.pushT);CL.pushT=setTimeout(cloudPush,2500)}
async function cloudPull(first){if(!CL.user||!navigator.onLine)return;let d;try{d=await cDoc().get()}catch(e){CL.msg='Нет связи с облаком';CL.err=true;refreshCloudUI();return}
  if(!d.exists){await cloudPush();return}
  const c=d.data(),cs=JSON.parse(c.state||'{}'),localChanged=(S._upd||0)>(S._sync||0),cloudNewer=c.updated>(S._sync||0);
  if(!S.profile){S=Object.assign({days:{},weeks:{},final:{}},cs);S._sync=c.updated;S._upd=c.updated;save(true);toast('Данные загружены из облака');render();return}
  if(cloudNewer&&!localChanged){S=Object.assign({days:{},weeks:{},final:{}},cs);S._sync=c.updated;S._upd=c.updated;save(true);render();return}
  if(cloudNewer&&localChanged){if(first){const ch=await ask('В облаке и в этом телефоне разные данные. Объединить их? (рекомендуется)',{ok:'Объединить',cancel:'Другое'});
      if(ch){S=deepMerge(cs,strip(S))}else{const tc=await ask('Чьи данные оставить?',{ok:'Из облака',cancel:'Из телефона'});if(tc)S=Object.assign({days:{},weeks:{},final:{}},cs)}}
    else S=deepMerge(cs,strip(S));
    save(true);await cloudPush();render();return}
  if(localChanged)await cloudPush();}
async function cloudStart(){if(!cloudAllowed())return;try{await fbLoad()}catch(e){return}
  try{await CL.auth.getRedirectResult()}catch(e){CL.msg=fbErrText(e);CL.err=true}
  CL.auth.onAuthStateChanged(async u=>{CL.user=u||null;refreshCloudUI();if(u){await cloudPull(true);refreshCloudUI();await cloudPhotosSync();save(true);if(VIEW.tab==='progress')rerender()}});
  addEventListener('online',()=>{if(CL.user)cloudPull()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CL.user)cloudPull()});}
function fbErrText(e){const c=(e&&e.code)||'';return ({'auth/invalid-email':'Неверный формат почты','auth/user-not-found':'Такой почты нет — зарегистрируйтесь','auth/wrong-password':'Неверный пароль','auth/invalid-credential':'Неверная почта или пароль','auth/email-already-in-use':'Эта почта уже зарегистрирована — войдите','auth/weak-password':'Пароль минимум 6 символов','auth/network-request-failed':'Нет интернета','auth/too-many-requests':'Слишком много попыток, подождите','auth/popup-closed-by-user':'Окно входа закрыто'})[c]||('Ошибка: '+(c||e.message||e))}
async function fbDo(fn){CL.busy=true;CL.msg='';refreshCloudUI();try{await fbLoad();await fn()}catch(e){CL.msg=fbErrText(e);CL.err=true}CL.busy=false;refreshCloudUI()}
function renderCloud(){
  if(!cloudAllowed())return `<div class="card"><h3>Облако</h3><div class="small muted">Вход и облако работают в GitHub-версии приложения: e87779282244-max.github.io/gipno-stroynost</div></div>`;
  const m=CL.msg?`<div class="tiny" style="margin-top:8px;color:${CL.err?'#b33':'var(--good)'}">${esc(CL.msg)}</div>`:'';
  if(CL.user)return `<div class="card" id="cloud"><h3>Облако <span class="r" style="color:var(--good)">● подключено</span></h3><div class="small">${esc(CL.user.email||'аккаунт Google')}</div><div class="tiny muted" style="margin-top:4px">Данные сохраняются автоматически и появятся на любом устройстве после входа.</div>${m}
    <div class="row" style="margin-top:10px"><button class="btn ghost sm" id="c-sync">Синхронизировать</button><button class="btn ghost sm" id="c-out">Выйти</button></div></div>`;
  return `<div class="card" id="cloud"><h3>Облако</h3><div class="small muted" style="margin-bottom:10px;line-height:1.4">Войдите, чтобы данные не потерялись при смене телефона. Текущие отметки сохранятся.</div>
    <button class="btn wide" id="c-google" ${CL.busy?'disabled':''}>Войти через Google</button>
    <div class="tiny muted" style="text-align:center;margin:10px 0">или по почте</div>
    <div class="field"><input id="c-mail" type="email" autocomplete="email" placeholder="Почта"></div>
    <div class="field"><input id="c-pass" type="password" autocomplete="current-password" placeholder="Пароль (мин. 6 символов)"></div>
    <div class="row"><button class="btn sm" id="c-in" ${CL.busy?'disabled':''}>Войти</button><button class="btn ghost sm" id="c-reg" ${CL.busy?'disabled':''}>Регистрация</button><button class="btn ghost sm" id="c-fg" style="margin-left:auto">Забыл пароль</button></div>${m}</div>`}
function bindCloud(){
  const g=$('#c-google');if(g)g.onclick=()=>fbDo(async()=>{const pr=new firebase.auth.GoogleAuthProvider();const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
    if(standalone){await CL.auth.signInWithRedirect(pr);return}try{await CL.auth.signInWithPopup(pr)}catch(e){if(e&&/popup-blocked|operation-not-supported/.test(e.code||''))await CL.auth.signInWithRedirect(pr);else throw e}});
  const cred=()=>[($('#c-mail')||{}).value.trim(),($('#c-pass')||{}).value];
  const i=$('#c-in');if(i)i.onclick=()=>{const [m,p]=cred();fbDo(()=>CL.auth.signInWithEmailAndPassword(m,p))};
  const r=$('#c-reg');if(r)r.onclick=()=>{const [m,p]=cred();fbDo(()=>CL.auth.createUserWithEmailAndPassword(m,p))};
  const f=$('#c-fg');if(f)f.onclick=()=>{const [m]=cred();if(!m){CL.msg='Введите почту — пришлём ссылку для нового пароля';CL.err=true;refreshCloudUI();return}fbDo(async()=>{await CL.auth.sendPasswordResetEmail(m);CL.msg='Письмо отправлено на '+m+' (проверьте «Спам»)';CL.err=false})};
  const s=$('#c-sync');if(s)s.onclick=()=>fbDo(()=>cloudPull());
  const o=$('#c-out');if(o)o.onclick=async()=>{if(!await ask('Выйти из аккаунта? Данные останутся и в телефоне, и в облаке.',{ok:'Выйти'}))return;await CL.auth.signOut();CL.msg='';render()};
}
function refreshCloudUI(){const c=$('#cloud');if(!c)return;const w=document.createElement('div');w.innerHTML=renderCloud();c.replaceWith(w.firstElementChild);bindCloud()}

/* ---------- ПРОФИЛЬ ---------- */
function renderMe(){const p=S.profile;
  return `<div class="card"><h3>Профиль</h3>
    <div class="field"><label>Имя</label><input data-p="name" value="${esc(p.name)}"></div>
    <div class="grid2"><div class="field"><label>День 1 (понедельник)</label><input type="date" data-p="start" value="${esc(p.start)}"></div>
    <div class="field"><label>Обычно встаю в</label><input type="time" data-p="wake" value="${esc(p.wake)}"></div>
    <div class="field"><label>Пол</label><select data-p="sex"><option value="m" ${p.sex!=='f'?'selected':''}>Мужской</option><option value="f" ${p.sex==='f'?'selected':''}>Женский</option></select></div>
    <div class="field"><label>Рост, см</label><input data-p="height" inputmode="numeric" value="${esc(p.height)}"></div>
    <div class="field"><label>Стакан воды, мл</label><input data-p="glass" inputmode="numeric" value="${esc(p.glass||250)}"></div>
    <div class="field"><label></label></div>
    <div class="field"><label>Стартовый вес</label><input data-p="w0" inputmode="decimal" value="${esc(p.w0)}"></div>
    <div class="field"><label>Стартовая талия</label><input data-p="waist0" inputmode="decimal" value="${esc(p.waist0)}"></div>
    <div class="field"><label>Стартовые бёдра</label><input data-p="hips0" inputmode="decimal" value="${esc(p.hips0)}"></div>
    <div class="field"><label>Стартовая грудь</label><input data-p="chest0" inputmode="decimal" value="${esc(p.chest0)}"></div>
    <div class="field"><label>Стартовая рука</label><input data-p="arm0" inputmode="decimal" value="${esc(p.arm0)}"></div>
    <div class="field"><label>Первый приём в поддержке</label><input type="time" data-p="mwin" value="${esc(p.mwin||'13:00')}"></div>
    <div class="field"><label>Звук таймера планки</label><select data-p="sound"><option value="on" ${p.sound!=='off'?'selected':''}>Включён</option><option value="off" ${p.sound==='off'?'selected':''}>Выключен</option></select></div></div>
    <div class="field"><label>Моя цель на 30 дней</label><textarea data-p="goal">${esc(p.goal)}</textarea></div></div>
  ${renderCloud()}
  ${renderRem()}
  ${renderStepsHelp()}
  <div class="card"><h3>Данные</h3><div class="small muted" style="margin-bottom:10px">Всё хранится в этом телефоне. Сохраните резервную копию перед сменой устройства.</div>
    <div class="row"><button class="btn ghost sm" id="exp">Сохранить копию</button><button class="btn ghost sm" id="imp">Загрузить копию</button></div>
    <input type="file" id="impf" accept=".json,application/json" hidden>
    ${S.fastScr?`<button class="btn ghost sm" id="refast" style="margin-top:14px;display:block">Пройти заново анкету длительной паузы</button>`:''}
    ${curDay()>30?`<button class="btn ghost sm" id="new-cycle" style="margin-top:14px;display:block">Начать новый круг 30 дней</button>`:''}
    <button class="btn ghost sm" id="reset" style="margin-top:14px;color:#b33">Начать программу заново</button></div>
  <div class="tiny muted" style="text-align:center;padding:10px">Гипно-стройность • v1.1</div>`}
function bindMe(){
  bindStepsHelp();
  const ncb=$('#new-cycle');if(ncb)ncb.onclick=newCycle;
  bindCloud();
  const rf=$('#refast');if(rf)rf.onclick=()=>{delete S.fastScr;save();toast('Анкета сброшена — она откроется в пятницу');rerender()};
  bindRem();
  document.querySelectorAll('[data-p]').forEach(el=>el.onchange=()=>{let v=el.value.trim();if(el.dataset.p==='start'&&v){const m=mondayFrom(v);if(m!==v){toast('День 1 — понедельник, '+fmtDate(parseISO(m)));}S.profile.prep=v<iso(new Date())?S.profile.prep:v;v=m}S.profile[el.dataset.p]=v;save();if(el.dataset.p==='start')rerender();else toast('Сохранено')});
  $('#exp').onclick=async()=>{const o=JSON.parse(JSON.stringify(S));o._photos={};for(const p of (S.photos||[])){const v=await photoGet(p.id);if(v)o._photos[p.id]=v}saveFile('gipno-stroynost-'+iso(new Date())+'.json',JSON.stringify(o),'application/json')};
  $('#imp').onclick=()=>$('#impf').click();
  $('#impf').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.profile)throw 0;ask('Заменить текущие данные копией?').then(okk=>{if(!okk)return;const ph=d._photos||{};delete d._photos;Object.entries(ph).forEach(([id,v])=>photoPut(id,v));S=d;S.weeks=S.weeks||{};S.final=S.final||{};save();toast('Копия загружена');render()})}catch(_){toast('Файл не подходит')}})};
  $('#reset').onclick=async()=>{if(!await ask('Удалить все отметки и начать заново? Сначала лучше сохранить копию.',{ok:'Удалить'}))return;S={days:{},weeks:{},final:{}};save();render()};
}

/* ---------- ОБЩЕЕ ---------- */
function logo(s=36){return `<svg class="logo" style="width:${s}px;height:${s}px" viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a5bd0"/><stop offset="1" stop-color="#3a2a6b"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#lg)"/><path d="M24 24m0-2a2 2 0 1 1-2 2 4 4 0 0 1 4-4 6 6 0 0 1 6 6 8 8 0 0 1-8 8 10 10 0 0 1-10-10 12 12 0 0 1 12-12 14 14 0 0 1 14 14" fill="none" stroke="#e9e0ff" stroke-width="2.6" stroke-linecap="round"/></svg>`}
function render(){
  if(S.profile)applyPendingSteps();
  clearInterval(tick);if(plankT){clearInterval(plankT);plankT=null}
  if(!S.profile)return renderOnboarding();
  $('#tabs').hidden=false;
  let fab=$('#sosfab');if(!fab){fab=document.createElement('button');fab.id='sosfab';fab.className='sos-fab';fab.textContent='SOS • хочу есть';fab.onclick=sosOpen;document.body.appendChild(fab)}
  fab.hidden=VIEW.tab!=='today';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===VIEW.tab));
  const t=curDay();
  const pi=prepInfo();
  const fb=S.fast&&!S.fast.end?`<div class="card" id="fast-banner" style="background:var(--good-weak);border-color:var(--good);padding:10px 14px;cursor:pointer"><div class="row between"><b class="small">Пищевая пауза идёт</b><span class="small" id="fb-t">${fmtDur(Date.now()-S.fast.start)}</span></div></div>`:'';
  let top=`<div class="top">${logo()}<div><div class="ttl">Гипно-стройность</div><div class="sub">${t>30?'поддержка • день '+Math.min(t-30,90)+' из 90':t<1?(pi&&pi.active?'подготовка • день 1 через '+(1-t)+' дн.':'старт через '+(1-t)+' дн.'):t>30?'программа завершена':'день '+t+' из 30'}</div></div></div>`;
  let body='';
  if(VIEW.tab!=='today'||VIEW.day)top+=fb;
  setTimeout(()=>{const b=$('#fast-banner');if(b)b.onclick=()=>{VIEW.tab='today';VIEW.day=S.fast.day!==curDay()?S.fast.day:null;render();scrollTo(0,0)};clearInterval(window._fbI);window._fbI=setInterval(()=>{const e=$('#fb-t');if(e&&S.fast&&!S.fast.end)e.textContent=fmtDur(Date.now()-S.fast.start)},15000)},0);
  if(VIEW.tab==='today'&&!VIEW.day&&pi&&pi.active){$('#app').innerHTML=top+renderPrep(pi);bindDay(0);return}
  if(VIEW.tab==='today'&&!VIEW.day&&t>30){const M=t-30;$('#app').innerHTML=top+renderMaint(M);bindMaint(M);if(!VIEW._wp){VIEW._wp=1;weekPrompt()}return}
  if(VIEW.tab==='today'){const n=VIEW.day||Math.min(30,Math.max(1,t));
    if(VIEW.day&&VIEW.day!==t)top+=`<button class="back" id="to-today">‹ К сегодняшнему дню</button>`;
    body=renderDay(n);$('#app').innerHTML=top+body;bindDay(n);if(!VIEW.day&&!VIEW._wp){VIEW._wp=1;weekPrompt()}const b=$('#to-today');if(b)b.onclick=()=>{VIEW.day=null;render()};return}
  if(VIEW.tab==='plan'){$('#app').innerHTML=top+renderPlan();document.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{VIEW.tab='today';VIEW.day=+el.dataset.day;render();scrollTo(0,0)});return}
  if(VIEW.tab==='progress'){$('#app').innerHTML=top+renderProgress();bindProgress();return}
  if(VIEW.tab==='lib'){$('#app').innerHTML=top+renderLib();bindLib();return}
  if(VIEW.tab==='me'){$('#app').innerHTML=top+renderMe();bindMe();return}
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{VIEW.tab=t.dataset.t;VIEW.day=null;VIEW.art=null;VIEW.week=null;render();scrollTo(0,0)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.profile&&VIEW.tab==='today')rerender()});
stepsFromUrl();
render();
cloudStart();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!inFrame()){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
